<!DOCTYPE html>
<html>
<head>
    <title>Factorial App</title>
</head>
<body>

<h1>Factorial Generator</h1>

<form method="POST">

<input type="number" name="start" placeholder="Start Number">

<input type="number" name="end" placeholder="End Number">

<button type="submit">Generate</button>

</form>

{% if results %}

<table border="1">

<tr>
<th>Number</th>
<th>Factorial</th>
</tr>

{% for item in results %}

<tr>
<td>{{ item.number }}</td>
<td>{{ item.factorial }}</td>
</tr>

{% endfor %}

</table>

{% endif %}

</body>
</html>
