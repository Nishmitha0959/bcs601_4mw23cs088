<!DOCTYPE html>
<html>
<head>
    <title>Factorial Calculator</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            text-align:center;
            padding-top:50px;
        }

        .box{
            background:white;
            width:400px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input{
            padding:10px;
            width:200px;
            margin:10px;
        }

        button{
            padding:10px 20px;
            background:#4CAF50;
            color:white;
            border:none;
            cursor:pointer;
        }

        h2{
            color:#333;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Factorial Calculator</h1>

    <form method="POST">

        <input type="number" name="number" placeholder="Enter a number" required>

        <br>

        <button type="submit">Calculate</button>

    </form>

    {% if factorial is not none %}
        <h2>Factorial of {{ number }} is {{ factorial }}</h2>
    {% endif %}

</div>

</body>
</html>
